<title>Malam Ketika Scorpio Tersenyum</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%;height:100dvh;margin:0;overflow:hidden;font-family:Tahoma,Verdana,sans-serif;background:#3a6ea5}
body{background:linear-gradient(#2f7de1 0%,#78b6f5 55%,#bfe0ff 60%);position:relative}
.hill{position:absolute;left:-20%;right:-20%;bottom:-30%;height:65%;background:radial-gradient(ellipse at 40% 0,#7fd13b,#3a9a1f 70%);border-radius:50%}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85;filter:blur(1px);animation:drift 60s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:50%;height:140%;left:15%;top:-60%}.cloud:after{width:40%;height:120%;right:12%;top:-40%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.win{position:absolute;left:50%;top:8px;bottom:calc(46px + env(safe-area-inset-bottom,0px));width:min(96vw,640px);max-height:760px;margin:auto 0;transform:translateX(-50%) scale(.2);opacity:0;pointer-events:none;z-index:5;color:#000;background:#ece9d8;border:3px solid #0a3bd0;border-radius:10px 10px 4px 4px;box-shadow:4px 8px 24px #0006;transition:.45s cubic-bezier(.2,1.4,.4,1);display:flex;flex-direction:column}
.win.open{transform:translateX(-50%) scale(1);opacity:1;pointer-events:auto}
.tb{background:linear-gradient(#3d95ff,#0a5be0 45%,#0845c8);color:#fff;font-weight:bold;font-size:13px;padding:5px 6px 5px 8px;display:flex;align-items:center;gap:6px;border-radius:6px 6px 0 0;text-shadow:1px 1px #003}
.tb span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb i{width:21px;height:21px;border:1px solid #fff;border-radius:4px;background:linear-gradient(#5ea4ff,#1c64e6);display:grid;place-items:center;font-style:normal;font-size:12px}
.tb i.x{background:linear-gradient(#f59a7c,#d6401c)}
.stage{margin:6px;flex:1;min-height:0;border:2px inset #fff;background:linear-gradient(#050a2a,#1b1f5e 70%,#3b2a7a);position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:tw 2.5s infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.char{width:min(30vw,20vh,130px);height:min(30vw,20vh,130px);flex:none;margin-top:8px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 0 14px #9cf8)}
.char.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1),float 3s ease-in-out .6s infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes pop{from{transform:scale(0) rotate(-40deg)}}
.bubble{margin:6px 10px 10px;width:calc(100% - 20px);flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:#fffbe6;border:2px solid #000;border-radius:6px;padding:8px 12px 10px;font-size:clamp(13px,3.8vw,16px);line-height:1.5;color:#000;position:relative}
.who{font-weight:bold;font-size:12px;color:#000;background:#cfe3ff;border:1px solid #000;display:inline-block;padding:1px 8px;border-radius:3px;margin-bottom:4px}
.bubble p{margin:.3em 0}
.title{font-size:clamp(20px,6vw,30px);text-align:center;color:#000;font-family:Georgia,serif;font-style:italic;text-shadow:2px 2px #ffd54a}
.foot{flex:none;padding:4px 8px 8px;display:flex;align-items:center;gap:8px}
.prog{flex:1;height:16px;border:2px inset #fff;background:#fff;padding:1px;display:flex;gap:2px;overflow:hidden}
.prog b{width:100%;max-width:0;background:repeating-linear-gradient(90deg,#2fd02f 0 8px,transparent 8px 10px);transition:max-width .5s;flex:none;width:100%}
.btn{touch-action:manipulation;position:relative;z-index:2;font:bold 13px Tahoma,sans-serif;padding:8px 14px;border:2px solid #003c74;border-radius:4px;background:linear-gradient(#fff,#ece9d8 85%,#d6d0c0);cursor:pointer;color:#000}
.btn:active{background:#d6d0c0}.btn.go{border-color:#2a6b0a;animation:pulse 1.4s infinite}
.btn[disabled]{opacity:.5;cursor:default;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 4px #7fe05088}}
.dlg{z-index:10;color:#000;position:absolute;left:50%;top:40%;width:min(88vw,340px);transform:translate(-50%,-50%);background:#ece9d8;border:3px solid #0a3bd0;border-radius:8px 8px 3px 3px;box-shadow:4px 8px 24px #0006;animation:drop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes drop{from{transform:translate(-50%,-250%)}}
.dlg .body{display:flex;gap:12px;padding:16px 14px;font-size:14px;align-items:center}
.dlg .ic{font-size:38px;animation:float 2s infinite}
.dlg .acts{text-align:center;padding-bottom:12px}
.task{z-index:9;position:fixed;left:0;right:0;bottom:0;height:34px;padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box;background:linear-gradient(#3168d5,#245edb 20%,#2054c9);display:flex;align-items:center;gap:8px;z-index:9;border-top:2px solid #5b92ee}
.start{height:100%;padding:0 22px 0 12px;color:#fff;font:italic bold 18px Tahoma;background:linear-gradient(#5fbf4a,#3a9a2a 50%,#2e8520);border-radius:0 14px 14px 0;display:flex;align-items:center;gap:6px;text-shadow:1px 1px 2px #000}
.tt{color:#fff;font-size:12px;background:#1e4fc0;border:1px solid #6d9bf0;padding:3px 10px;border-radius:3px;max-width:45vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tray{margin-left:auto;height:100%;background:#0f8ae6;color:#fff;font-size:12px;display:flex;align-items:center;padding:0 12px;gap:6px;border-left:2px solid #0a5bb5}
.petal{position:fixed;top:-30px;z-index:20;pointer-events:none;animation:fall linear forwards;font-size:20px}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
.pic{position:relative;width:100%;height:100%;border:4px solid #fff;outline:2px solid #0a3bd0;border-radius:4px;background:#fff;transform:rotate(-3deg);box-shadow:0 4px 12px #0008;animation:pop .8s cubic-bezier(.2,1.6,.4,1)}.pic img{width:100%;height:100%;object-fit:cover;display:block}.pic .fl{position:absolute;right:-14px;top:-16px;font-size:26px;animation:float 2s infinite}
.final .char{width:min(40vw,26vh,160px);height:min(40vw,26vh,160px);overflow:visible}
.final .bubble{background:#fff0f6}
.final h2{margin:.2em 0;color:#000;font-family:Georgia,serif}

const S=[
{c:'aku',w:'Surat dari Langit',title:1,t:['Malam Ketika Scorpio Tersenyum']},
{c:'scorpio',w:'Scorpio ♏',t:['Semalam, aku pergi ke langit dan bertanya,','“Kenapa rasi bintang Scorpio cengar-cengir dari tadi?”']},
{c:'sagi',w:'Sagitarius ♐',t:['Sagitarius menjawab bahwa Scorpio sedang senang. Ada salah satu anak manusia—yang sejak lama kami curigai sebagai seorang bidadari—sedang berulang tahun di bawah naungan rasi bintangnya.','“Oh, ya?” tanyaku.','Rasi-rasi yang lain mengangguk.']},
{c:'gemini',w:'Gemini ♊',t:['“16 November,” celetuk Gemini.']},
{c:'capri',w:'Capricorn ♑',t:['“Lalu, kenapa Capricorn ikut-ikutan tersenyum?” tanyaku lagi.']},
{c:'aqua',w:'Aquarius ♒',t:['Aquarius, tetangga Capricorn, menjawab,','“Gadis itu sedang berpacaran dengan seorang pemuda yang konon merupakan reinkarnasi Herkules, yang kebetulan lahir pada 13 Januari. Masih di bawah naungan Capricorn.”','Aku tersenyum.']},
{c:'libra',w:'Libra ♎',t:['“Tidakkah kalian ingin mengirimkan doa untuk gadis itu?”','“Tentu,” jawab Libra.','“Kami kirimkan doa keselamatan, kesejahteraan, umur yang tidak sekadar panjang, tetapi juga bahagia dan berarti. Kesuksesan, ketenangan, kesehatan, serta rangkaian doa-doa baik lainnya.”']},
{c:'aku',w:'Aku ★',t:['Aku terdiam sejenak.','“Bagaimana denganmu? Tidakkah kau juga ingin mengirimkan doa?”','Aku mengangguk.','Tentu saja aku ingin.']},
{c:'aku',w:'Doaku ★',t:['Aku mendoakan agar gadis itu selalu bahagia bersama pasangannya. Agar hari-harinya tidak lagi terlalu sering dipenuhi stres dan tangis. Agar ia mau makan dengan lebih baik dan tidak terlalu pilih-pilih. Agar ia selalu dikelilingi orang-orang baik. Agar setiap langkahnya dipertemukan dengan hal-hal yang baik.','Aku juga mendoakan agar ia tumbuh menjadi pribadi yang semakin baik, tanpa harus kehilangan dirinya sendiri.']},
{c:'ganesha',w:'Dewa Ganesha 🐘',t:['Dan masih banyak lagi doa yang ingin kusampaikan.','Sedemikian panjangnya, sampai-sampai aku khawatir Dewa Ganesha akan kesulitan menuliskannya.','Jadi, mungkin sebagian doaku akan kusimpan sendiri.','Biar langit yang menyampaikannya.','Biar bintang-bintang yang menjaganya.']},
{c:'scorpio',w:'Scorpio ♏',t:['Dan kalau suatu hari nanti kau bertanya mengapa Scorpio begitu bahagia pada malam ini, mungkin ia akan menjawab:','“Karena hari ini, seorang gadis bernama Rifkah Apatana Azalia sedang bertambah usia.”']},
{c:'photo',w:'Untuk Rifkah 🌸',fin:1,t:['<h2>Selamat ulang tahun, Rifkah.</h2>','Semoga langkahmu selalu menemukan jalan yang baik.','Semoga hidup memberimu lebih banyak alasan untuk tersenyum daripada menangis.','Dan semoga kau selalu dikelilingi cinta yang membuatmu merasa aman untuk menjadi dirimu sendiri.','<b>Mekarlah dengan indah, sebagaimana bunga Azalea.</b> 🌸']}
];
const st=$('stage');
for(let i=0;i<40;i++){const s=document.createElement('div');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;transform:scale(${.6+Math.random()})`;st.prepend(s)}
let i=0,tok=0,clicked=false;
function petals(n){for(let k=0;k<n;k++){const p=document.createElement('div');p.className='petal';p.textContent=['🌸','💮','✨','⭐'][k%4];p.style.left=Math.random()*100+'vw';p.style.setProperty('--dx',(Math.random()*160-80)+'px');p.style.animationDuration=(4+Math.random()*4)+'s';p.style.animationDelay=Math.random()*2+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),10000)}}
async function show(n){
 i=n;const s=S[n],my=++tok;
 $('char').innerHTML=C[s.c];$('char').classList.remove('pop');void $('char').offsetWidth;$('char').classList.add('pop');
 $('pg').style.maxWidth=((n+1)/S.length*100)+'%';
 $('back').disabled=n==0;$('next').textContent=n==S.length-1?'↻ Ulangi':'Lanjut ›';
 $('win').classList.toggle('final',!!s.fin);
 const b=$('bub');b.innerHTML=`<span class="who">${s.w}</span>`;
 if(s.fin)petals(30);
 for(const line of s.t){
  const p=document.createElement('p');if(s.title)p.className='title';b.appendChild(p);
  if(line.startsWith('<')){p.innerHTML=line;await new Promise(r=>setTimeout(r,500));if(my!=tok)return;continue}
  for(let k=1;k<=line.length;k++){if(my!=tok)return;p.textContent=line.slice(0,k);b.scrollTop=b.scrollHeight;await new Promise(r=>setTimeout(r,s.title?60:22))}
  await new Promise(r=>setTimeout(r,280));
 }
}
$('open').onclick=()=>{$('dlg').style.display='none';$('win').classList.add('open');setTimeout(()=>show(0),500)};
$('next').onclick=()=>show(i==S.length-1?0:i+1);
$('back').onclick=()=>i>0&&show(i-1);
$('cl').onclick=()=>{$('win').animate([{transform:'translateX(-50%) rotate(-3deg)'},{transform:'translateX(-50%) rotate(3deg)'},{transform:'translateX(-50%)'}],300);petals(8)};
const tick=()=>$('clk').textContent=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}).replace('.',':');tick();setInterval(tick,10000);
</script></body></html>
